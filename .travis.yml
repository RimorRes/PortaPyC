dist: focal
language: python

python:
  - "3.7"
  - "3.8"
  - "3.9"
  - "3.10"
  - "3.11"
  - "3.12"
  - "3.13"

cache: pip

install:
  # Upgrade pip and install the project along with its test dependencies from pyproject.toml
  - python -m pip install --upgrade pip
  - pip install .[test]

script:
  - pytest
